<style>
    /* Loader Styles */
    #loading-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #2c3e50;
        z-index: 9999;
        display: none;
        justify-content: center;
        align-items: center;
        flex-direction: column;
    }

    .loader-container {
        position: relative;
        width: 60px;
        height: 60px;
        animation: rotateLoader 1.5s linear infinite;
    }

    .dot {
        position: absolute;
        width: 20px;
        height: 20px;
        border-radius: 50%;
    }

    .dot-yellow { background-color: #f1c40f; top: 0; left: 50%; transform: translateX(-50%); }
    .dot-blue   { background-color: #3498db; bottom: 5px; left: 0; }
    .dot-red    { background-color: #e74c3c; bottom: 5px; right: 0; }

    @keyframes rotateLoader {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    /* ====== BODY / FONDO DIVIDIDO ====== */
    html, body {
        min-height: 100vh;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(90deg, #fcfcfc 50%, #eef3f6 50%) !important;
        background-attachment: fixed;
        background-size: 100% 100%;
        color: #333;
    }

    /* ====== CONTENEDOR PRINCIPAL ====== */
    .box-container {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 40px 20px 20px;
        box-sizing: border-box;
    }

    .container {
        display: flex !important;
        flex-direction: row !important;
        justify-content: center !important;
        align-items: flex-start !important;
        gap: 50px;
        max-width: 1100px !important;
        width: 100% !important;
        margin: 0 auto !important;
        padding: 20px !important;
        background: transparent !important;
        box-shadow: none !important;
        position: relative !important;
        height: auto !important;
        box-sizing: border-box;
    }

    /* ====== COLUMNA IZQUIERDA (LOGIN) ====== */
    .container__login {
        flex: 0 0 400px !important;
        width: 400px !important;
        max-width: 400px !important;
        padding: 0 !important;
        margin: 0 !important;
        background: transparent !important;
        position: relative !important;
        box-shadow: none !important;
        left: auto !important;
        top: auto !important;
        display: block !important;
        box-sizing: border-box;
    }

    .container__login--header {
        text-align: center;
        margin-bottom: 15px;
    }

    .container__login--header img {
        max-width: 200px;
        height: auto;
    }

    .container__login--title h2 {
        font-size: 1.2rem;
        font-weight: bold;
        color: #333;
        margin: 0 0 15px;
        text-align: center;
    }

    /* Banner azul */
    .blue-banner {
        background-color: #0033a0;
        color: white;
        padding: 12px 15px;
        border-radius: 8px;
        margin-bottom: 18px;
        display: flex;
        align-items: center;
        font-size: 0.85em;
        gap: 10px;
    }
    .blue-banner img {
        width: 40px;
        height: 40px;
        object-fit: contain;
        flex-shrink: 0;
    }
    .blue-banner a {
        color: #fff;
        text-decoration: underline;
        font-size: 0.9em;
    }

    /* Tarjeta blanca del formulario */
    .login-card-content {
        background: #ffffff;
        border-radius: 8px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        padding: 22px;
        margin-bottom: 15px;
        box-sizing: border-box;
    }

    /* Tabs */
    .tabs {
        display: flex;
        border-bottom: 1px solid #ccc;
        margin-bottom: 15px;
    }
    .tab {
        padding: 10px 18px;
        cursor: pointer;
        color: #666;
        border-bottom: 2px solid transparent;
        font-weight: bold;
        font-size: 0.9em;
        transition: all 0.2s;
    }
    .tab.active {
        color: #0033a0;
        border-bottom: 2px solid #0033a0;
    }

    /* Mensaje informativo */
    .info-msg {
        background-color: #e6f0fa;
        color: #333;
        padding: 10px 30px 10px 12px;
        border-radius: 4px;
        font-size: 0.82em;
        margin-bottom: 18px;
        position: relative;
        line-height: 1.4;
    }
    .info-msg .close {
        position: absolute;
        right: 10px;
        top: 6px;
        cursor: pointer;
        font-size: 1.1em;
        color: #666;
    }

    /* Formulario */
    .label {
        margin-bottom: 6px;
    }
    .label label {
        font-size: 0.85em;
        font-weight: 600;
        color: #444;
    }

    .custom-form-control,
    .container input[type="tel"],
    .container input[type="password"],
    .container select {
        width: 100%;
        box-sizing: border-box;
        padding: 10px 12px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 0.95em;
        outline: none;
        transition: border-color 0.2s;
        background: #fff;
    }
    .custom-form-control:focus,
    .container input:focus,
    .container select:focus {
        border-color: #0033a0;
    }

    .id-row {
        display: flex;
        gap: 10px;
    }
    .id-type { width: 35%; }
    .id-num  { width: 65%; }

    .btn-container {
        margin-top: 20px;
    }
    .btn-main {
        background-color: #0033a0;
        color: #fff;
        border: none;
        padding: 12px 20px;
        border-radius: 6px;
        font-size: 1em;
        font-weight: bold;
        cursor: pointer;
        transition: background 0.2s;
    }
    .btn-main:hover {
        background-color: #002277;
    }

    /* Links inferiores */
    .links-row {
        display: flex;
        justify-content: space-between;
        margin-top: 15px;
        font-size: 0.9em;
        padding: 0 5px;
    }
    .links-row a {
        color: #0033a0;
        text-decoration: none;
        font-weight: bold;
    }
    .links-row a:hover {
        text-decoration: underline;
    }

    /* ====== COLUMNA DERECHA (PROMO) ====== */
    .container__info {
        flex: 1 1 500px !important;
        max-width: 520px !important;
        width: auto !important;
        padding: 0 !important;
        background: transparent !important;
        position: relative !important;
        box-shadow: none !important;
        left: auto !important;
        top: auto !important;
        right: auto !important;
        display: block !important;
        box-sizing: border-box;
    }

    .container__info img {
        border-radius: 10px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        display: block;
        width: 100%;
        height: auto;
    }

    /* Iconos inferiores */
    .bottom-icons-container {
        display: flex;
        align-items: center;
        position: relative;
        margin-top: 25px;
        padding-bottom: 20px;
        width: 100%;
        gap: 8px;
    }

    .icons-scroll-view {
        display: flex;
        overflow-x: auto;
        scroll-behavior: smooth;
        gap: 12px;
        width: 100%;
        -ms-overflow-style: none;
        scrollbar-width: none;
        padding: 4px;
    }
    .icons-scroll-view::-webkit-scrollbar { display: none; }

    .bottom-icon {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        color: #0033a0;
        font-size: 0.72rem;
        font-weight: bold;
        flex: 0 0 90px;
        cursor: pointer;
        line-height: 1.2;
    }

    .bottom-icon-box {
        width: 52px;
        height: 52px;
        border: 1px solid #d1d1d1;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 8px;
        background-color: #fff;
        transition: all 0.2s;
    }
    .bottom-icon-box:hover {
        border-color: #0033a0;
        background-color: #f4f8ff;
        transform: translateY(-2px);
    }
    .bottom-icon-box svg {
        width: 24px;
        height: 24px;
        fill: #0033a0;
    }

    .arrow-btn {
        width: 32px;
        height: 32px;
        border: 1px solid #d1d1d1;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #0033a0;
        cursor: pointer;
        background: #fff;
        flex-shrink: 0;
        z-index: 2;
        transition: all 0.2s;
    }
    .arrow-btn:hover {
        border-color: #0033a0;
        background-color: #f4f8ff;
    }
    .arrow-btn.left  { margin-right: 5px; }
    .arrow-btn.right { margin-left: 5px; }
    .arrow-btn svg { width: 16px; height: 16px; fill: #0033a0; }

    /* Botón volver */
    .back-link {
        padding: 10px;
        position: absolute;
        top: 0;
        left: 0;
        z-index: 1000;
    }
    .back-link a {
        text-decoration: none;
        color: #0033a0;
        font-weight: bold;
        font-family: sans-serif;
    }

    /* ====== RESPONSIVE (MÓVIL) ====== */
    @media (max-width: 900px) {
        body {
            background: #ffffff !important;
        }

        .box-container {
            padding: 30px 12px 20px;
        }

        .container {
            flex-direction: column !important;
            align-items: center !important;
            gap: 25px;
            padding: 10px !important;
            width: 100% !important;
        }

        .container__login {
            width: 100% !important;
            max-width: 100% !important;
            flex: none !important;
        }

        .container__info {
            width: 100% !important;
            max-width: 100% !important;
            flex: none !important;
        }

        input, select, textarea {
            font-size: 16px !important;
        }

        .login-card-content { padding: 15px !important; }
    }
</style>
